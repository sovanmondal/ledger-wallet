# One command to run the whole stack locally:  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: wallet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      PORT: "8080"
      # App reaches Postgres via the compose network host "db".
      DATABASE_URL: "postgres://app:app@db:5432/wallet?sslmode=disable"
      LOG_LEVEL: "info"
      RUN_MIGRATIONS: "true"
      ALLOWED_ORIGIN: "*"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
